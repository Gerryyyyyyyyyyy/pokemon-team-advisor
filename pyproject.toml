[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-team-advisor"
version = "0.1.0"
description = "Explainable recommendations for the sixth member of a Pokémon team."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Gerryyyyyyyyyyy" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "matplotlib>=3.9,<4.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "scikit-learn>=1.5,<2.0",
    "streamlit>=1.39,<2.0",
]

[project.urls]
Homepage = "https://github.com/Gerryyyyyyyyyyy/pokemon-team-advisor"
Repository = "https://github.com/Gerryyyyyyyyyyy/pokemon-team-advisor.git"
Issues = "https://github.com/Gerryyyyyyyyyyy/pokemon-team-advisor/issues"

[dependency-groups]
dev = [
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pokemon_team_advisor"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true
